name: Release by tag

# Un tag v* publica una release INMUTABLE con los assets MRMP.zip y MRMP.zip.sha256, tras correr los MISMOS
# guardianes que mr-main (via el workflow reutilizable build.yml) y comprobar que el commit del tag esta en
# mr-main. Si el tag ya tiene release, falla en vez de sobrescribirla. La pre-release rodante ci-latest la
# mantiene package.yml en cada push a mr-main.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: write
    with:
      publish: tag
