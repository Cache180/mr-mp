name: Package mod

on:
  push:
    branches:
      - "mr-main"
  workflow_dispatch:

concurrency:
  group: ci-latest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Guardianes + build + publicacion rodante en ci-latest (el tag ci-latest se mueve al commit publicado).
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: write
    with:
      publish: ci-latest
