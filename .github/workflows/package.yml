name: Package mod

on:
  push:
    branches:
      - "mr-main"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build MRMP.zip
        shell: bash
        run: |
          set -euo pipefail
          # Only package paths that exist in the repo (e.g. LICENSE vs LICENSE.md).
          items=()
          for p in icons lua locales scripts settings ui vehicles LICENSE* NOTICES.md NOTICE-MR.md README.md; do
            if [ -e "$p" ]; then items+=("$p"); else echo "skip (missing): $p"; fi
          done
          zip -r MRMP.zip "${items[@]}"
          sha256sum MRMP.zip > MRMP.zip.sha256
          cat MRMP.zip.sha256
          unzip -l MRMP.zip | tail -n 1

      - name: Archive MRMP artifact
        uses: actions/upload-artifact@v4
        with:
          name: MRMP
          path: |
            MRMP.zip
            MRMP.zip.sha256
          if-no-files-found: error

      - name: Publish MRMP.zip to the rolling pre-release ci-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="MRMP.zip built from ${GITHUB_SHA} (rolling build, replaced on every push to mr-main)."
          if gh release view ci-latest >/dev/null 2>&1; then
            gh release upload ci-latest MRMP.zip MRMP.zip.sha256 --clobber
            gh release edit ci-latest --prerelease --notes "$notes"
          else
            gh release create ci-latest MRMP.zip MRMP.zip.sha256 --prerelease --target "${GITHUB_SHA}" --title "MRMP ci-latest" --notes "$notes"
          fi
